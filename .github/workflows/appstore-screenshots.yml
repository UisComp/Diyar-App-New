name: App Store screenshots

# Manual only: Actions → "App Store screenshots" → Run workflow.
# Replaces the screenshots of the App Store version in progress with
# ios/fastlane/screenshots/en-US. No build, no submission for review.
on:
  workflow_dispatch:

jobs:
  upload:
    name: Upload screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: ios

      - name: Install Fastlane
        working-directory: ios
        run: bundle install

      - name: Upload screenshots
        working-directory: ios
        run: bundle exec fastlane ios screenshots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
