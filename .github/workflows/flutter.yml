name: Build & Deploy (Flutter)

# فرع testing    -> نسخة تجريبية:  Google Play (Internal testing) + TestFlight
# فرع production -> نسخة إنتاج:    Google Play (Production)        + App Store review
on:
  push:
    branches: [production, testing]
  workflow_dispatch:

# امنع تشغيل نشرتين متزامنتين على نفس الفرع
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ ANDROID
  android:
    name: Android → Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Play track
        id: cfg
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "play_track=production" >> "$GITHUB_OUTPUT"
          else
            echo "play_track=internal" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PW
          keyPassword=$KEY_PW
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Restore Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > android/fastlane/play-service-account.json

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: android

      - name: Deploy to Google Play (${{ steps.cfg.outputs.play_track }})
        working-directory: android
        run: bundle exec fastlane android playstore
        env:
          PLAY_TRACK: ${{ steps.cfg.outputs.play_track }}
          PLAY_RELEASE_STATUS: completed
          PLAY_JSON_KEY_FILE: fastlane/play-service-account.json

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  # ---------------------------------------------------------------------- IOS
  ios:
    name: iOS → App Store
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select iOS lane
        id: cfg
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "lane=release" >> "$GITHUB_OUTPUT"
          else
            echo "lane=testflight" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore GoogleService-Info.plist
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: ios

      - name: Install Fastlane
        working-directory: ios
        run: bundle install

      - name: Deploy to ${{ steps.cfg.outputs.lane }}
        working-directory: ios
        run: bundle exec fastlane ios ${{ steps.cfg.outputs.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa
          path: build/ios/ipa/Runner.ipa
          if-no-files-found: ignore
