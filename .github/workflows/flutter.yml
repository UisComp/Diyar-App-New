name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Setup Java ─────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Setup Flutter ──────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 4. Restore google-services.json ───────────────────────────────────
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # ── 5. Install dependencies ───────────────────────────────────────────
      - name: Install Dependencies
        run: flutter pub get

      # ── 6. Run code generation ────────────────────────────────────────────
      - name: Run Build Runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # ── 7. Build release APK (faster & smaller) ───────────────────────────
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # ── 8. List APK output ───────────────────────────────────────────────
      - name: List APK Output
        run: ls build/app/outputs/flutter-apk/

      # ── 9. Upload APK as GitHub artifact ─────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk

      # ── 10. Deploy to Firebase App Distribution ──────────────────────────
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: "Build from commit ${{ github.sha }}"
